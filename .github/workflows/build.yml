name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: unzip -o screencapture-pro.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Locate and Grant execute permission for gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          echo "Building in $GRADLE_DIR"
          cd "$GRADLE_DIR" && ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorder-APK
          path: "**/build/outputs/apk/debug/*.apk"
          
